name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: cs2pr

      - name: Install PHPCS + WPCS
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer wp-coding-standards/wpcs

      # phpcs.xml pins extensions to php, so this never wanders into other file types.
      - name: Run PHPCS
        run: $(composer global config bin-dir --absolute)/phpcs -q --report=checkstyle . | cs2pr

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # The suite reads the toggle script straight out of the PHP heredoc, so
      # there is nothing to build and no second copy that could drift.
      - name: Run the toggle tests
        run: npm test

  phpunit:
    name: PHPUnit (WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The floor and the ceiling. No multisite job: unlike the plugins that
      # carry one, this plugin has no uninstall.php, stores no options and
      # touches no site-scoped state, so a network run exercises the same code
      # path twice.
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.0'
          - php: '8.3'
            wordpress: 'latest'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The runner already has Docker, which is all wp-env needs, so CI runs the
      # same stack as bin/test.sh does locally -- one code path, no drift.
      - name: Start wp-env
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
          WP_ENV_CORE: ${{ matrix.wordpress == 'latest' && 'WordPress/WordPress' || format('WordPress/WordPress#{0}', matrix.wordpress) }}
        run: npx --yes @wordpress/env start

      - name: Install dev dependencies
        run: |
          npx --yes @wordpress/env run tests-cli --env-cwd=wp-content/plugins/wp-showhide \
            composer install --no-interaction --no-progress

      - name: Run PHPUnit
        run: |
          npx --yes @wordpress/env run tests-cli --env-cwd=wp-content/plugins/wp-showhide \
            vendor/bin/phpunit
